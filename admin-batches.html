<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upcoming Batches</title><style>
body{margin:0;background:#f5f7f9;font-family:Arial;color:#123}.wrap{max-width:950px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dde5ea;border-radius:15px;padding:18px;margin-bottom:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.input{width:100%;padding:11px;border:1px solid #dce4e9;border-radius:9px;box-sizing:border-box}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800}.primary{background:#ed5b2a;color:#fff}.item{padding:13px 0;border-bottom:1px solid #edf0f2;display:flex;justify-content:space-between}.del{background:#fff;border:1px solid #ddd}.back{display:inline-block;margin-bottom:16px;text-decoration:none;color:#ed5b2a;font-weight:800}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><a class="back" href="admin-v4-crm.html">← Admin</a><div class="card"><h1>Upcoming Batch Highlights</h1><p>Add only the batches you want highlighted.</p><div class="row"><input class="input" id="name" placeholder="Batch / Package name"><input class="input" id="date" placeholder="Date"><input class="input" id="destination" placeholder="Destination"><input class="input" id="status" value="OPEN" placeholder="Status"></div><br><button class="btn primary" onclick="add()">Add batch</button></div><div class="card"><div id="list"></div></div></div><script>
const get=()=>JSON.parse(localStorage.getItem('oat_batches')||'[]');function render(){let a=get();list.innerHTML=a.length?a.map((b,i)=>`<div class="item"><div><b>${b.name}</b><br><small>${b.date} • ${b.destination} • ${b.status}</small></div><button class="btn del" onclick="del(${i})">Delete</button></div>`).join(''):'No batches yet.'}function add(){let a=get();a.push({name:name.value||'Upcoming Trip',date:date.value||'TBC',destination:destination.value||'',status:status.value||'OPEN'});localStorage.setItem('oat_batches',JSON.stringify(a));name.value=date.value=destination.value='';render()}function del(i){let a=get();a.splice(i,1);localStorage.setItem('oat_batches',JSON.stringify(a));render()}render();
</script></body></html>
