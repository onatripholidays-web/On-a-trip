<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08233f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Team OAT | On A Trip Business App</title><link rel="manifest" href="./manifest.webmanifest"><style>
:root{--navy:#08233f;--navy2:#103d66;--orange:#ee5a2a;--bg:#f3f6f8;--line:#dce4e9;--muted:#6b7b87}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#102335}body{overflow:hidden}.shell{height:100%;display:grid;grid-template-rows:68px 1fr 72px}.header{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brand img{width:92px;height:46px;object-fit:contain}.brand strong{font-size:18px;color:var(--navy)}.brand span{display:block;color:var(--muted);font-size:11px;font-weight:700}.actions{display:flex;align-items:center;gap:8px}.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;color:var(--navy);cursor:pointer}.content{position:relative;min-height:0}.module{position:absolute;inset:0;display:none;background:var(--bg)}.module.active{display:block}.module iframe{width:100%;height:100%;border:0;background:#fff}.nav{background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px max(8px,env(safe-area-inset-left)) max(7px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));gap:5px}.nav button{border:0;background:transparent;border-radius:12px;padding:8px 4px;color:var(--muted);font-weight:800;font-size:11px;cursor:pointer}.nav button .ico{display:block;font-size:20px;line-height:22px;margin-bottom:2px}.nav button.active{background:#eef4f8;color:var(--navy)}.nav button.active .ico{color:var(--orange)}@media(min-width:900px){.shell{grid-template-rows:72px 1fr}.nav{position:fixed;left:0;top:72px;bottom:0;width:220px;display:flex;flex-direction:column;padding:18px 12px;border-top:0;border-right:1px solid var(--line);z-index:6}.nav button{text-align:left;padding:13px 16px;display:flex;align-items:center;gap:12px;font-size:13px}.nav button .ico{margin:0;font-size:20px}.content{margin-left:220px}.header{padding:0 24px}.brand img{width:105px}.brand strong{font-size:20px}}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-weight:800;pointer-events:none}.hidden{display:none!important}
</style></head><body><div class="shell"><header class="header"><div class="brand"><img src="crm/assets/on-a-trip-logo.png" alt="On A Trip Holidays"><div><strong>Team OAT</strong><span>On A Trip Business App</span></div></div><div class="actions"><button class="pill" onclick="reloadCurrent()">↻ Refresh</button></div></header><main class="content"><div id="loading" class="loading">Loading Team OAT…</div><section class="module active" data-key="crm"><iframe title="CRM" src="crm/index.html"></iframe></section><section class="module" data-key="itinerary"><iframe title="AI Itinerary" loading="lazy" src="ai-itinerary/index.html"></iframe></section><section class="module" data-key="invoice"><iframe title="Invoice Maker" loading="lazy" src="invoice-maker/index.html"></iframe></section><section class="module" data-key="admin"><iframe title="Admin Panel" loading="lazy" src="admin-panel/index.html"></iframe></section></main><nav class="nav" aria-label="Team OAT modules"><button data-target="crm" class="active"><span class="ico">👥</span>CRM</button><button data-target="itinerary"><span class="ico">✨</span>AI Itinerary</button><button data-target="invoice"><span class="ico">🧾</span>Invoices</button><button data-target="admin"><span class="ico">⚙️</span>Admin</button></nav></div><script>
const buttons=[...document.querySelectorAll('.nav button')],mods=[...document.querySelectorAll('.module')];
function show(key,query=''){mods.forEach(m=>m.classList.toggle('active',m.dataset.key===key));buttons.forEach(b=>b.classList.toggle('active',b.dataset.target===key));localStorage.setItem('team_oat_module',key);document.getElementById('loading').classList.add('hidden');const m=mods.find(x=>x.dataset.key===key);if(m&&query){const f=m.querySelector('iframe');const base=f.src.split('?')[0];f.src=base+(query?'?'+query:'');}}
window.TeamOAT={openModule:(key,params={})=>{const q=new URLSearchParams(params).toString();show(key,q)},show};
buttons.forEach(b=>b.onclick=()=>show(b.dataset.target));
function reloadCurrent(){const m=mods.find(x=>x.classList.contains('active'));if(m){const f=m.querySelector('iframe');f.src=f.src}}
const saved=localStorage.getItem('team_oat_module');if(saved&&mods.some(m=>m.dataset.key===saved))show(saved);else show('crm');
setTimeout(()=>document.getElementById('loading').classList.add('hidden'),900);if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
