<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment Invoicer | On A Trip Holidays</title><style>
@page{size:707px 2423px;margin:0}*{box-sizing:border-box}body{margin:0;background:#eef2f5;font-family:Arial,sans-serif;color:#10283c}.top{height:72px;background:#08233f;color:#fff;display:flex;align-items:center;padding:10px 22px;justify-content:space-between}.top img{height:50px;max-width:180px;object-fit:contain;background:#fff;border-radius:6px;padding:3px}.top b{font-size:18px}.wrap{width:707px;margin:18px auto;display:grid;grid-template-columns:280px 1fr;gap:18px}.form{background:#fff;border-radius:12px;padding:16px;border:1px solid #dbe3e8}.form h2{margin:0 0 12px;font-size:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;margin:9px 0 4px}input,select,textarea{width:100%;padding:8px;border:1px solid #d5dfe5;border-radius:7px;font:12px Arial}textarea{min-height:50px}.btn{border:0;border-radius:8px;padding:10px 12px;font-weight:800;cursor:pointer;margin-top:10px}.primary{background:#ed5b2a;color:white}.secondary{background:#edf2f5}.preview{width:707px;min-height:2423px;background:white;padding:32px 34px;box-shadow:0 4px 25px #0001}.invoice-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #ed5b2a;padding-bottom:14px}.invoice-head img{width:185px;max-height:75px;object-fit:contain}.company{text-align:right;font-size:9px;line-height:1.45}.company b{font-size:14px}.title{text-align:center;margin:24px 0 18px}.title h1{margin:0;font-size:24px}.title p{margin:5px;color:#71808a;font-size:10px}.status{display:inline-block;background:#e8f7ef;color:#08744a;border-radius:99px;padding:6px 12px;font-size:10px;font-weight:900}.box{border:1px solid #d7e0e5;border-radius:8px;margin:12px 0;overflow:hidden}.head{background:#f4f7f8;padding:8px 10px;font-size:10px;font-weight:900}.grid4{display:grid;grid-template-columns:repeat(4,1fr)}.cell{padding:9px;border-right:1px solid #d7e0e5;border-top:1px solid #d7e0e5;min-height:48px;font-size:10px}.cell:nth-child(4n){border-right:0}.cell b{display:block;color:#71808a;font-size:8px;text-transform:uppercase;margin-bottom:3px}.guestgrid{display:grid;grid-template-columns:1fr 1fr}.guestgrid .cell{border-right:1px solid #d7e0e5}.guestgrid .wide{grid-column:1/-1}.tariff table{width:100%;border-collapse:collapse;font-size:9px}.tariff th,.tariff td{border:1px solid #d7e0e5;padding:7px;text-align:left}.tariff th{background:#f4f7f8}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px}.amount{border:1px solid #d7e0e5;border-radius:7px;padding:10px}.amount b{display:block;font-size:8px;color:#71808a}.amount strong{font-size:16px}.paid{background:#e8f7ef;border-color:#a5d9be;color:#08744a}.notes{padding:10px;border:1px solid #d7e0e5;border-radius:8px;font-size:9px;line-height:1.5;margin:10px 0}.footer{text-align:center;border-top:2px solid #ed5b2a;padding-top:8px;font-size:8px;color:#647681}.hidden{display:none}@media print{body{background:#fff}.top,.form{display:none!important}.wrap{display:block;margin:0;width:707px}.preview{box-shadow:none;margin:0;width:707px;min-height:2423px;padding:32px 34px}}
</style></head><body>
<header class="top"><img src="assets/logo.png"><b>PAYMENT INVOICER</b></header>
<div class="wrap"><section class="form"><h2>Payment Invoice</h2>
<label>Customer Name *</label><input id="name" required>
<label>Destination *</label><input id="dest" required>
<div class="row"><div><label>Guest Contact *</label><input id="contact" type="tel" required></div><div><label>Email (optional)</label><input id="email" type="email"></div></div>
<label>Salesperson Name *</label><input id="salesperson" required placeholder="Person generating invoice">
<div class="row"><div><label>Booking ID</label><input id="bookingId"></div><div><label>Booking Date & Time</label><input id="bookingDateTime" readonly></div></div>
<div class="row"><div><label>Trip Start</label><input id="start" type="date"></div><div><label>Trip End</label><input id="end" type="date"></div></div>
<div class="row"><div><label>Booking Type</label><select id="type"><option>Group</option><option>Family</option><option>Couple</option><option>Customized</option><option>Pilgrimage</option><option>Corporate</option></select></div><div><label>Pax</label><input id="pax" type="number" value="1" min="1"></div></div>
<label>Tariff / Pax</label><input id="tariff" placeholder="25000">
<label>Inclusions</label><textarea id="inclusions"></textarea>
<div class="row"><div><label>Total Fare</label><input id="total" type="number" min="0"></div><div><label>Amount Paid</label><input id="paid" type="number" min="0"></div></div>
<div class="row"><div><label>Payment Mode</label><select id="mode"><option>UPI</option><option>Bank Transfer</option><option>Cash</option><option>Card</option></select></div><div><label>Payment Date & Time</label><input id="paymentDateTime" type="datetime-local"></div></div>
<div id="utrWrap"><label>UTR / Transaction ID *</label><input id="utr" placeholder="Enter UPI UTR / transaction ID"></div>
<label>Payment Status</label><select id="status"><option>PAID IN FULL</option><option>PARTIALLY PAID</option><option>ADVANCE RECEIVED</option><option>PENDING</option></select>
<label>Notes</label><textarea id="notes">Payment received against the above booking.</textarea>
<div><button class="btn primary" onclick="updateInvoice()">Update Invoice</button><button class="btn secondary" onclick="printInvoice()">Print / Save PDF</button></div>
<p style="font-size:9px;color:#71808a">PDF billing canvas: 707 × 2423 px. Suggested filename is automatically set to Customer Name (Destination).pdf.</p></section>
<section class="preview" id="preview"></section></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function nowLocal(){const d=new Date();const pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}
function fmtDate(v){if(!v)return '—';const d=new Date(v.includes('T')?v:v+'T00:00');return d.toLocaleDateString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtDT(v){if(!v)return '—';const d=new Date(v);return d.toLocaleString('en-IN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function money(v){return Number(v||0).toLocaleString('en-IN')}
function sync(){
 const mode=$('mode').value;$('utrWrap').classList.toggle('hidden',mode!=='UPI');
 const total=Number($('total').value||0),paid=Number($('paid').value||0),bal=Math.max(0,total-paid);return {name:$('name').value.trim(),dest:$('dest').value.trim(),contact:$('contact').value.trim(),email:$('email').value.trim(),salesperson:$('salesperson').value.trim(),bookingId:$('bookingId').value.trim(),bookingDateTime:$('bookingDateTime').value,start:$('start').value,end:$('end').value,type:$('type').value,pax:$('pax').value,tariff:$('tariff').value,inclusions:$('inclusions').value,total,paid,bal,mode,utr:$('utr').value.trim(),status:$('status').value,paymentDateTime:$('paymentDateTime').value,notes:$('notes').value};}
function updateInvoice(){const d=sync();if(!d.name||!d.dest||!d.contact||!d.salesperson){alert('Customer name, destination, contact number and salesperson name are required.');return}if(d.mode==='UPI'&&!d.utr){alert('Enter the UTR / Transaction ID for UPI payment.');return}render(d);localStorage.setItem('oat_payment_invoice',JSON.stringify(d))}
function render(d){const full=d.bal<=0; if(full)d.status='PAID IN FULL';$('preview').innerHTML=`<div class="invoice-head"><img src="assets/logo.png"><div class="company"><b>ON A TRIP HOLIDAYS</b><br>Travel with us. Explore the magical places.<br>16-2-701/6/14A BanarasArcade, Besides Yezdi showroom,<br>Malakpet, Hyderabad 500036<br>+91-8125248909 • +91-9182894146<br>travel@onatripholidays.com<br>www.onatripholidays.com</div></div><div class="title"><h1>Travel Confirmation Voucher</h1><p>PAYMENT INVOICE</p><span class="status">${esc(d.status)}</span></div><div class="box"><div class="grid4"><div class="cell"><b>Booking ID</b>${esc(d.bookingId||'—')}</div><div class="cell"><b>Booking Date & Time</b>${fmtDT(d.bookingDateTime)}</div><div class="cell"><b>Trip Start</b>${fmtDate(d.start)}</div><div class="cell"><b>Trip End</b>${fmtDate(d.end)}</div><div class="cell"><b>Destination</b>${esc(d.dest)}</div><div class="cell"><b>Booking Type</b>${esc(d.type)}</div><div class="cell"><b>Pax</b>${esc(d.pax)}</div><div class="cell"><b>Salesperson</b>${esc(d.salesperson)}</div></div></div><div class="box"><div class="head">GUEST DETAILS</div><div class="guestgrid"><div class="cell"><b>Name</b>${esc(d.name)}</div><div class="cell"><b>Contact No</b>${esc(d.contact)}</div><div class="cell"><b>Email</b>${esc(d.email||'Not provided')}</div><div class="cell"><b>Payment Date & Time</b>${fmtDT(d.paymentDateTime)}</div></div></div><div class="box tariff"><div class="head">TARIFF PLAN</div><table><tr><th>TARIFF / PAX</th><th>NO. OF PAX</th><th>BOOKING STATUS</th><th>INCLUSIONS</th></tr><tr><td>${esc(d.tariff||'—')}</td><td>${esc(d.pax)}</td><td>${esc(d.status)}</td><td>${esc(d.inclusions||'—')}</td></tr></table><div class="amounts"><div class="amount"><b>Total Fare</b><strong>₹ ${money(d.total)}</strong></div><div class="amount paid"><b>Amount Paid</b><strong>₹ ${money(d.paid)}</strong></div><div class="amount"><b>Balance</b><strong>₹ ${money(d.bal)}</strong></div></div></div><div class="notes"><b>PAYMENT DETAILS</b><br>Payment Mode: ${esc(d.mode)}${d.mode==='UPI'?'<br>UTR / Transaction ID: '+esc(d.utr):''}<br>Payment Date & Time: ${fmtDT(d.paymentDateTime)}</div><div class="notes"><b>PAYMENT NOTE</b><br>${esc(d.notes||'Payment received against the above booking.')}</div><div class="notes"><b>IMPORTANT NOTES</b><br>Balance amount should be cleared before departure. Primary guest must carry valid photo ID. Hotel check-in/check-out and meal/room plans are subject to hotel policies. Early check-in or late check-out is subject to availability.</div><div class="notes"><b>TERMS & CANCELLATION</b><br>Booking is confirmed after receipt of the applicable payment and availability confirmation. Similar hotel category may be provided if selected property is unavailable. Personal expenses and items not listed as inclusions are excluded. Cancellation/refund terms depend on the booking and supplier conditions communicated at confirmation.</div><div class="notes"><b>PAYMENT DETAILS</b><br>Account Name: ON A TRIP HOLIDAYS.<br>Account Number: 2602261212328370<br>Account Type: Current Account<br>IFSC: AUBL0002612<br>UPI: 8125248909 • onatripholidays0976@aubank</div><div class="footer">ON A TRIP HOLIDAYS • 16-2-701/6/14A BanarasArcade, Besides Yezdi showroom, Malakpet, Hyderabad 500036 • travel@onatripholidays.com • Instagram: onatripholidays<br>Generated by: ${esc(d.salesperson)}</div>`}
function safeFile(s){return s.replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,120)||'Customer'}
function printInvoice(){const d=sync();if(!d.name||!d.dest||!d.contact||!d.salesperson){alert('Complete required customer and salesperson fields first.');return}if(d.mode==='UPI'&&!d.utr){alert('Enter the UTR / Transaction ID for UPI payment.');return}render(d);document.title=`${safeFile(d.name)} (${safeFile(d.dest)})`;window.print()}
$('mode').onchange=()=>{sync();render(sync())};$('paymentDateTime').value=nowLocal();$('bookingDateTime').value=nowLocal();$('bookingId').value=String(Date.now()).slice(-10);const saved=JSON.parse(localStorage.getItem('oat_payment_invoice')||'null');if(saved){Object.keys(saved).forEach(k=>{if($(k))$(k).value=saved[k]});}render(sync());
</script></body></html>
