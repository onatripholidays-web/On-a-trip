<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | On A Trip Holidays</title><meta name="robots" content="noindex,nofollow"><style>:root{--navy:#08233f;--orange:#ed5b2a;--line:#dce5ea}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f4f7f9,#fff);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#12283b}.card{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 60px #08233f18;text-align:center}.logo{width:190px;max-width:80%;height:auto;margin:4px auto 20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:900;color:#71818d}.title{font-size:30px;font-weight:950;margin:8px 0}.sub{color:#71818d;margin:0 0 24px}.field{text-align:left;margin:14px 0}label{display:block;font-size:12px;font-weight:900;text-transform:uppercase;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit}.pass{position:relative}.pass input{padding-right:72px}.show{position:absolute;right:10px;top:7px;border:0;background:none;padding:8px;color:#176da9;font-weight:800;cursor:pointer}.btn{width:100%;border:0;border-radius:11px;background:var(--orange);color:#fff;padding:14px;font-weight:900;font-size:15px;cursor:pointer;margin-top:6px}.links{display:flex;justify-content:space-between;margin-top:15px;font-size:12px}.links a{color:#176da9;text-decoration:none;font-weight:800}.error{display:none;color:#a61b1b;background:#fff0f0;border:1px solid #efb6b6;border-radius:10px;padding:10px;margin-top:12px;font-size:12px}.hint{font-size:11px;color:#71818d;margin-top:18px}</style></head><body><div class="card"><img class="logo" src="assets/on-a-trip-logo.png" alt="On A Trip Holidays"><div class="eyebrow">HOLIDAYS ADMIN</div><div class="title">Admin Login</div><p class="sub">Secure access to the AI Quotation Maker</p><form id="login"><div class="field"><label>Password</label><div class="pass"><input id="password" type="password" autocomplete="current-password" placeholder="Enter admin password" required><button class="show" type="button" id="toggle">Show</button></div></div><button class="btn" type="submit">Login to Admin</button><div class="links"><a href="index.html">← Main website</a><a href="#" id="forgot">Forgot password?</a></div><div id="err" class="error"></div></form><div class="hint">Authorized team access only.</div></div><script>const PASSWORD='Teamoat';if(sessionStorage.getItem('oat_admin_auth')==='1')location.replace('admin-ai-itinerary.html');document.getElementById('toggle').onclick=()=>{const p=document.getElementById('password'),t=document.getElementById('toggle');p.type=p.type==='password'?'text':'password';t.textContent=p.type==='password'?'Show':'Hide'};document.getElementById('forgot').onclick=e=>{e.preventDefault();const x=document.getElementById('err');x.style.display='block';x.textContent='Please contact the On A Trip Holidays administrator to reset the password.'};document.getElementById('login').onsubmit=e=>{e.preventDefault();const p=document.getElementById('password').value;if(p===PASSWORD){sessionStorage.setItem('oat_admin_auth','1');location.replace('admin-ai-itinerary.html')}else{const x=document.getElementById('err');x.style.display='block';x.textContent='Incorrect password. Please try again.'}};</script></body></html>
