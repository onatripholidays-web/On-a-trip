<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Itinerary & Quotation | On A Trip Holidays</title><meta name="robots" content="noindex,nofollow"><style>
:root{--navy:#08233f;--orange:#ed5b2a;--bg:#f4f7f9;--line:#dce5ea;--muted:#71818d;--green:#08744a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#12283b;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}.top{background:var(--navy);color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}.top a{color:#fff;text-decoration:none;font-weight:800}.brand{display:flex;align-items:center;gap:10px}.brand img{width:112px;background:#ffd75a;border-radius:5px}.wrap{max-width:1400px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:390px 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 24px #0a29420a}.form{display:grid;gap:10px}label{font-size:11px;text-transform:uppercase;font-weight:900;letter-spacing:.05em}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit;color:#12283b}textarea{min-height:75px}.row,.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:900;cursor:pointer;min-height:44px}.primary{background:var(--orange);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font-size:11px;color:#067247;background:#e8f7ef;padding:7px 10px;border-radius:99px;font-weight:900;display:inline-block}.muted{color:var(--muted)}.quote-title{font-size:28px;font-weight:950;margin:8px 0}.day{border:1px solid var(--line);border-radius:11px;padding:14px;margin:10px 0}.day h3{margin:0 0 7px}.day p{line-height:1.5;margin:6px 0}.box{background:#f8fafb;border-radius:10px;padding:12px;margin-top:11px}.price{font-size:28px;font-weight:950}.ed[contenteditable=true]{outline:2px dashed #f0b24d;background:#fffaf0;border-radius:5px;padding:2px}.empty{padding:50px 10px;text-align:center;color:var(--muted)}.stepbar{display:flex;gap:8px;margin-bottom:14px}.step{flex:1;padding:9px;text-align:center;border-radius:8px;background:#eef2f5;font-size:11px;font-weight:900}.step.active{background:var(--navy);color:#fff}.screen-actions{margin-bottom:12px}.print-only{display:none}@media(max-width:950px){.grid{grid-template-columns:1fr}}@media(max-width:600px){.row,.two{grid-template-columns:1fr}.wrap{padding:12px}.quote-title{font-size:22px}.top{padding:12px 14px}.brand img{width:92px}}
@media print{@page{size:A4;margin:10mm}body{background:#fff}.top,.builder,.screen,.stepbar{display:none!important}.wrap{padding:0}.print-only{display:block}.print-header{display:flex;justify-content:space-between;border-bottom:3px solid var(--orange);padding-bottom:8px}.print-header img{width:150px}.print-header div{text-align:right;font-size:10px;line-height:1.5}.print-title{font-size:23px;font-weight:900;margin:12px 0}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;border:1px solid #ddd;padding:9px;font-size:10px}.meta b{display:block;color:#657784;font-size:8px;text-transform:uppercase}.print-day{border:1px solid #ddd;border-radius:7px;padding:8px;margin:7px 0;break-inside:avoid}.print-day h3{font-size:12px;margin:0 0 4px}.print-day p{font-size:10px;line-height:1.4}.print-two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.print-box{border:1px solid #ddd;border-radius:7px;padding:8px;margin:7px 0;break-inside:avoid}.print-box h4{font-size:11px;margin:0 0 5px}.print-box p,.print-box li{font-size:9.5px;line-height:1.4}.print-price{font-size:19px;font-weight:900}.print-footer{border-top:2px solid var(--orange);margin-top:12px;padding-top:7px;text-align:center;font-size:9px}}
</style></head><body><script>if(sessionStorage.getItem('oat_admin_auth')!=='1')location.replace('admin.html');</script>
<header class="top"><div class="brand"><img src="assets/on-a-trip-logo.png"><b>AI ITINERARY & QUOTATION</b></div><a href="admin-v4-crm-final.html">← Admin Dashboard</a></header>
<div class="wrap"><div class="grid"><section class="builder card"><h1>✨ AI Itinerary Builder</h1><p class="muted">First create the itinerary. Then approve it, create the quotation, and finally generate the PDF.</p><div class="stepbar"><div id="s1" class="step active">1 ITINERARY</div><div id="s2" class="step">2 QUOTATION</div><div id="s3" class="step">3 PDF</div></div><form id="form" class="form">
<div class="row"><div><label>Guest Name *</label><input id="guest" required></div><div><label>Travellers *</label><input id="pax" type="number" min="1" value="4" required></div></div><label>Destination *</label><input id="dest" placeholder="Kashmir / Char Dham / Ladakh" required><div class="row"><div><label>Start City</label><input id="start" value="Hyderabad"></div><div><label>Language</label><select id="language"><option>English</option><option>Telugu</option><option>English + Telugu</option></select></div></div><div class="row"><div><label>Start Date *</label><input id="startDate" type="date" required></div><div><label>End Date *</label><input id="endDate" type="date" required></div></div><div class="row"><div><label>Trip Type</label><select id="type"><option>Family</option><option>Pilgrimage</option><option>Adventure</option><option>Couples</option><option>Premium</option></select></div><div><label>Hotel Category</label><select id="hotel"><option>3 Star</option><option>4 Star</option><option>5 Star</option><option>Premium</option></select></div></div><div class="row"><div><label>Vehicle</label><select id="vehicle"><option>Private Car</option><option>Ertiga</option><option>Innova Crysta</option><option>Tempo Traveller 12 Seater</option><option>Tempo Traveller 17 Seater</option><option>Tempo Traveller 20 Seater</option></select></div><div><label>Meals</label><select id="meals"><option>Breakfast & Dinner</option><option>Breakfast Only</option><option>All Meals</option><option>Satvik Veg Meals</option></select></div></div><label>Special Requirements</label><textarea id="special" placeholder="Senior citizens, darshan, honeymoon, child-friendly, etc."></textarea><label>Additional Instructions</label><textarea id="instruction"></textarea><div class="actions"><button class="btn primary" type="submit">✨ Generate Itinerary with AI</button></div><div id="msg" class="muted">Uses your existing /api/generate-itinerary engine.</div></form></section>
<section class="card"><div class="screen"><div id="out"><div class="empty">Enter trip details and generate the AI itinerary.</div></div></div><div class="print-only" id="printSheet"></div></section></div></div>
<script>
const $=id=>document.getElementById(id),v=id=>(($(id)?.value)||'').trim(),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let itinerary=null,quote=null,edit=false;
function setStep(n){[1,2,3].forEach(i=>$('s'+i).classList.toggle('active',i===n))}
function dayCount(){let a=v('startDate'),b=v('endDate');return a&&b?Math.max(1,Math.min(30,Math.ceil((new Date(b)-new Date(a))/86400000)+1)):1}
function payload(){return{guest:v('guest')||'Guest',dest:v('dest'),days:dayCount(),pax:+v('pax')||1,start:v('start')||'TBC',dates:v('startDate')+' to '+v('endDate'),language:v('language'),type:v('type'),hotel:v('hotel'),vehicle:v('vehicle'),meals:v('meals'),budget:'Price to be quoted',special:v('special')||'None',instruction:v('instruction')||'None'}}
function renderItinerary(){setStep(1);$('out').innerHTML='<span class="status">STEP 1 — AI ITINERARY</span><div class="quote-title">'+esc(itinerary.title)+'</div><p>'+esc(itinerary.summary)+'</p>'+itinerary.days.map((d,i)=>'<div class="day"><h3>Day '+esc(d.day)+' — <span class="ed" data-i="'+i+'" data-k="title">'+esc(d.title)+'</span></h3><p><span class="ed" data-i="'+i+'" data-k="summary">'+esc(d.summary)+'</span></p><p><b>Hotel:</b> <span class="ed" data-i="'+i+'" data-k="hotel">'+esc(d.hotel)+'</span> · <b>Meals:</b> <span class="ed" data-i="'+i+'" data-k="meals">'+esc(d.meals)+'</span></p></div>').join('')+'<div class="two"><div class="box"><b>Accommodation</b><p>'+esc(itinerary.hotels)+'</p></div><div class="box"><b>Vehicle</b><p>'+esc(itinerary.vehicle)+'</p></div></div><div class="box"><b>Meals</b><p>'+esc(itinerary.meals)+'</p></div><div class="box"><b>Notes</b><p>'+esc(itinerary.notes)+'</p></div><div class="actions screen-actions"><button class="btn secondary" onclick="toggleEdit()">✏️ '+(edit?'Save Edits':'Edit Itinerary')+'</button><button class="btn primary" onclick="createQuoteForm()">✅ Approve & Create Quotation</button></div>'}
function toggleEdit(){edit=!edit;document.querySelectorAll('.ed').forEach(e=>e.contentEditable=edit);if(!edit)document.querySelectorAll('.ed').forEach(e=>itinerary.days[+e.dataset.i][e.dataset.k]=e.innerText.trim());renderItinerary()}
async function generate(){let p=payload();if(!p.dest)return $('msg').textContent='Destination is required.';if(new Date(v('endDate'))<new Date(v('startDate')))return $('msg').textContent='End date must be after start date.';$('msg').textContent='✨ AI is generating the itinerary…';try{let r=await fetch('/api/generate-itinerary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}),d=await r.json();if(!r.ok)throw Error(d.error||'AI request failed');if(!d.days||d.days.length!==p.days)throw Error('AI returned the wrong number of days.');itinerary=d;renderItinerary();$('msg').textContent='✅ Review the itinerary. Approve only when ready.'}catch(e){$('msg').textContent='❌ '+e.message}}
function createQuoteForm(){if(edit){edit=false;document.querySelectorAll('.ed').forEach(e=>{itinerary.days[+e.dataset.i][e.dataset.k]=e.innerText.trim();e.contentEditable=false})}setStep(2);$('out').innerHTML='<span class="status">STEP 2 — CREATE QUOTATION</span><div class="quote-title">Commercial Quotation</div><p>Itinerary approved. Now add the commercial price.</p><div class="two"><div class="box"><label>Price Per Person *</label><input id="qPrice" placeholder="₹ 30,500"></div><div class="box"><label>Quotation Validity</label><input id="qValid" value="7 days"></div></div><div class="two"><div class="box"><label>Inclusions</label><textarea id="qInc">'+esc((itinerary.inclusions||[]).join('\n'))+'</textarea></div><div class="box"><label>Exclusions</label><textarea id="qExc">'+esc((itinerary.exclusions||[]).join('\n'))+'</textarea></div></div><div class="box"><label>Terms & Conditions</label><textarea id="qTerms">Package is subject to availability and confirmation. Final booking terms will be shared at confirmation.</textarea></div><div class="actions"><button class="btn secondary" onclick="renderItinerary()">← Back to Itinerary</button><button class="btn primary" onclick="createQuote()">💰 Create Quotation</button></div>'}
function createQuote(){let price=v('qPrice');if(!price)return $('msg').textContent='Please enter price per person.';let n=+(price.replace(/[^\d.]/g,''))||0;quote={...payload(),...itinerary,price,total:n*(+v('pax')||1),validity:v('qValid')||'7 days',inclusions:v('qInc').split('\n').map(x=>x.trim()).filter(Boolean),exclusions:v('qExc').split('\n').map(x=>x.trim()).filter(Boolean),terms:v('qTerms')};setStep(3);renderQuote()}
function renderQuote(){$('out').innerHTML='<span class="status">STEP 3 — QUOTATION READY</span><div class="quote-title">'+esc(quote.title)+'</div><p>'+esc(quote.summary)+'</p><div class="two"><div class="box"><b>Guest</b><p>'+esc(quote.guest)+'</p></div><div class="box"><b>Destination</b><p>'+esc(quote.dest)+' · '+quote.days.length+' Days</p></div></div>'+quote.days.map(d=>'<div class="day"><h3>Day '+esc(d.day)+' — '+esc(d.title)+'</h3><p>'+esc(d.summary)+'</p><p><b>Hotel:</b> '+esc(d.hotel)+' · <b>Meals:</b> '+esc(d.meals)+'</p></div>').join('')+'<div class="two"><div class="box"><b>Price / Person</b><div class="price">'+esc(quote.price)+'</div></div><div class="box"><b>Total Package</b><div class="price">₹ '+quote.total.toLocaleString('en-IN')+'</div></div></div><div class="two"><div class="box"><b>Inclusions</b><ul>'+quote.inclusions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><div class="box"><b>Exclusions</b><ul>'+quote.exclusions.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div></div><div class="box"><b>Validity & Terms</b><p>'+esc(quote.validity)+' — '+esc(quote.terms)+'</p></div><div class="actions"><button class="btn secondary" onclick="createQuoteForm()">✏️ Edit Quotation</button><button class="btn primary" onclick="finalPDF()">📄 Generate Final PDF</button></div>'}
function finalPDF(){let inc=quote.inclusions.map(x=>'<li>'+esc(x)+'</li>').join(''),exc=quote.exclusions.map(x=>'<li>'+esc(x)+'</li>').join('');$('printSheet').innerHTML='<div class="print-header"><img src="assets/on-a-trip-logo.png"><div><b>ON A TRIP HOLIDAYS</b><br>Let\'s explore the magical places<br>+91-8125248909<br>www.onatripholidays.com</div></div><div class="print-title">'+esc(quote.title)+'</div><div class="meta"><div><b>Guest</b>'+esc(quote.guest)+'</div><div><b>Contact</b>'+esc(v('contact'))+'</div><div><b>Destination</b>'+esc(quote.dest)+'</div><div><b>Travellers</b>'+quote.pax+'</div><div><b>Dates</b>'+esc(quote.dates)+'</div><div><b>Start City</b>'+esc(quote.start)+'</div></div>'+quote.days.map(d=>'<div class="print-day"><h3>DAY '+esc(d.day)+' — '+esc(d.title)+'</h3><p>'+esc(d.summary)+'</p><p><b>Hotel:</b> '+esc(d.hotel)+' &nbsp; <b>Meals:</b> '+esc(d.meals)+'</p></div>').join('')+'<div class="print-two"><div class="print-box"><h4>Accommodation</h4><p>'+esc(quote.hotels)+'</p></div><div class="print-box"><h4>Transport</h4><p>'+esc(quote.vehicle)+'</p></div></div><div class="print-box"><h4>Meals</h4><p>'+esc(quote.meals)+'</p></div><div class="print-box"><h4>Package Quote</h4><div class="print-price">'+esc(quote.price)+' per person · Total ₹ '+quote.total.toLocaleString('en-IN')+'</div></div><div class="print-two"><div class="print-box"><h4>Inclusions</h4><ul>'+inc+'</ul></div><div class="print-box"><h4>Exclusions</h4><ul>'+exc+'</ul></div></div><div class="print-box"><h4>Terms & Conditions</h4><p>'+esc(quote.terms)+'</p></div><div class="print-footer">On A Trip Holidays · Hyderabad · +91-8125248909 · www.onatripholidays.com</div>';window.print()}
$('form').addEventListener('submit',e=>{e.preventDefault();generate()});
</script>
<script id="oat-step2-gst">
(function(){
  window.OAT_GST_RATE = 0.05;

  window.oatCalculateQuotation = function(price, pax){
    price = Number(price) || 0;
    pax = Number(pax) || 0;
    const subtotal = price * pax;
    const gst = subtotal * window.OAT_GST_RATE;
    return {
      price: price,
      pax: pax,
      subtotal: subtotal,
      gstRate: 5,
      gst: gst,
      total: subtotal + gst,
      calculation: '₹' + price.toLocaleString('en-IN') + ' × ' + pax +
                   ' = ₹' + subtotal.toLocaleString('en-IN')
    };
  };

  window.oatRenderQuotationTotals = function(container, price, pax){
    if(!container) return;
    const q = window.oatCalculateQuotation(price, pax);
    container.innerHTML =
      '<div class="oat-quotation-total">' +
        '<div><b>Package Cost</b></div>' +
        '<div class="oat-calculation">₹' + q.price.toLocaleString('en-IN') +
          ' × ' + q.pax + ' = <b>₹' + q.subtotal.toLocaleString('en-IN') + '</b></div>' +
        '<div>GST @ 5% <span>₹' + q.gst.toLocaleString('en-IN', {maximumFractionDigits:2}) + '</span></div>' +
        '<div class="oat-grand-total"><b>Grand Total</b><b>₹' +
          q.total.toLocaleString('en-IN', {maximumFractionDigits:2}) + '</b></div>' +
      '</div>';
  };
})();
</script>
<style id="oat-step2-gst-style">
.oat-quotation-total{display:grid;gap:8px;margin-top:12px;padding:14px;border:1px solid #dce4e9;border-radius:12px;background:#fff;font-size:14px}
.oat-quotation-total>div{display:flex;justify-content:space-between;gap:12px}
.oat-calculation{font-size:16px}
.oat-grand-total{margin-top:4px;padding-top:10px;border-top:1px solid #dce4e9;font-size:17px}
</style>

</body></html>
