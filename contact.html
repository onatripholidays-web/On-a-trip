</meta></link></meta></head><body><nav class="nav"><a class="brand" href="index.html"><img alt="On A Trip Holidays" src="assets/logo.png"/></a><div class="navlinks"><a href="packages.html">Packages</a><a href="pilgrimage.html">Pilgrimage</a><a href="itineraries.html">Itineraries</a><a href="packages.html#batches">Batches</a><a href="blogs.html">Blogs</a><a href="blogs.html#new-destination-guides">Guides</a><a href="about.html">About</a><a href="contact.html">Contact</a></div><a class="wa" href="https://wa.me/919182894146?text=Hi%20On%20A%20Trip%20Holidays%2C%20I%20want%20a%20travel%20quote">WhatsApp Us</a></nav><section class="hero" style="min-height:360px"><div class="hero-inner"><div class="eyebrow">Free travel quote</div><h1>Let's plan your trip.</h1><p>Fill in the basics. We'll open WhatsApp with your enquiry details.</p></div></section><section class="section"><div class="form"><form id="enquiryForm" onsubmit="sendLead(event)"><div class="formgrid"><div><input id="name" placeholder="Full name" required=""/></div><div><input id="phone" placeholder="Mobile / WhatsApp number" required=""/></div><div><input id="destination" placeholder="Destination" required=""/></div><div><input id="date" type="date"/></div><div><input id="travellers" placeholder="Number of travellers"/></div><div><select id="type"><option>Package enquiry</option><option>Custom trip</option><option>Pilgrimage</option><option>International</option><option>Group departure</option></select></div><div class="full"><textarea id="message" placeholder="Tell us anything important: departure city, hotel preference, vehicle, budget, etc."></textarea></div></div><button class="btn">Send Enquiry on WhatsApp</button></form></div></section><script>
async function sendLead(e) {
  e.preventDefault();

  const form = document.getElementById("enquiryForm");

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const destination = document.getElementById("destination").value.trim();
  const travelDate = document.getElementById("date").value;
  const travellers = document.getElementById("travellers").value;
  const enquiryType = document.getElementById("type").value;
  const message = document.getElementById("message").value.trim();

  if (!name || !phone) {
    alert("Please enter your name and mobile number.");
    return;
  }

  const button = form.querySelector("button");

  if (button) {
    button.disabled = true;
    button.textContent = "Saving Enquiry...";
  }

  try {
    const response = await fetch("/api/enquiry", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name: name,
        phone: phone,
        destination: destination,
        travel_date: travelDate || null,
        travellers: travellers ? Number(travellers) : null,
        enquiry_type: enquiryType,
        message: message
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Unable to save enquiry.");
    }

    const whatsappMessage =
      `Hi On A Trip Holidays!%0A` +
      `Name: ${encodeURIComponent(name)}%0A` +
      `Phone: ${encodeURIComponent(phone)}%0A` +
      `Destination: ${encodeURIComponent(destination)}%0A` +
      `Travel date: ${encodeURIComponent(travelDate)}%0A` +
      `Travellers: ${encodeURIComponent(travellers)}%0A` +
      `Type: ${encodeURIComponent(enquiryType)}%0A` +
      `Message: ${encodeURIComponent(message)}`;

    window.location.href =
      "https://wa.me/919182894146?text=" + whatsappMessage;

  } catch (error) {
    console.error("Enquiry submission error:", error);

    alert(
      "We could not save your enquiry right now. Please try again."
    );

    if (button) {
      button.disabled = false;
      button.textContent = "Send Enquiry on WhatsApp";
    }
  }
}
  </script>
