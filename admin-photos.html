<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Updater</title><style>
body{margin:0;background:#f5f7f9;font-family:Arial;color:#123}.wrap{max-width:950px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dde5ea;border-radius:15px;padding:18px;margin-bottom:15px}.input{width:100%;padding:11px;border:1px solid #dce4e9;border-radius:9px;box-sizing:border-box;margin:7px 0}.btn{border:0;border-radius:9px;padding:11px 15px;font-weight:800}.primary{background:#ed5b2a;color:#fff}.back{display:inline-block;margin-bottom:16px;text-decoration:none;color:#ed5b2a;font-weight:800}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pic{border:1px solid #e0e7eb;border-radius:10px;overflow:hidden}.pic img{width:100%;height:150px;object-fit:cover}.pic div{padding:10px}.del{background:#fff;border:1px solid #ddd}@media(max-width:650px){.gallery{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><a class="back" href="admin-v4-crm.html">← Admin</a><div class="card"><h1>Photo Updater</h1><p>Add a destination/batch image URL. For production, connect this to your preferred image storage.</p><input class="input" id="title" placeholder="Photo title / destination"><input class="input" id="url" placeholder="Image URL (https://...)"><button class="btn primary" onclick="add()">Add photo</button></div><div class="card"><div id="gallery" class="gallery"></div></div></div><script>
const get=()=>JSON.parse(localStorage.getItem('oat_photos')||'[]');function render(){let a=get();gallery.innerHTML=a.length?a.map((p,i)=>`<div class="pic"><img src="${p.url}" onerror="this.style.display='none'"><div><b>${p.title}</b><br><button class="btn del" onclick="del(${i})">Remove</button></div></div>`).join(''):'No photos added yet.'}function add(){let a=get();if(!url.value)return;a.unshift({title:title.value||'Destination',url:url.value});localStorage.setItem('oat_photos',JSON.stringify(a));title.value=url.value='';render()}function del(i){let a=get();a.splice(i,1);localStorage.setItem('oat_photos',JSON.stringify(a));render()}render();
</script></body></html>
